<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Logical architecture of the RAG app: Streamlit tabs call ingestion, retrieval, generation and evaluation services in the core layer; the vector store persists to ChromaDB, providers call LLM backends, evaluation appends to a JSON log, and ConfigProvider injects settings into the core." font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- layers -->
  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1">
