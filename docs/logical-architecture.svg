    <text x="461" y="211">get_llm_response()</text>
    <text x="461" y="271">prefix → provider</text>
    <text x="636" y="211">record + read</text>
    <text x="616" y="271">faithfulness</text>
    <text x="198" y="374">add · query · get_all_documents</text>
